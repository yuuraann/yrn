
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi primera web</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
    }

    main {
      padding: 30px;
      max-width: 650px;
    }

    h1 {
      font-size: 3.5rem;
      margin-bottom: 15px;
    }

    p {
      color: #cbd5e1;
      font-size: 1.2rem;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 22px;
      border-radius: 10px;
      background: #70e1c1;
      color: #101827;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hola, mundo.</h1>
    <p>Esta es mi primera página web.
    Muy pronto podrás descubrir aquí mis proyectos.</p>
    <a href="https://github.com">Mi GitHub</a>
  </main>
</body>
</html>
